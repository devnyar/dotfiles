# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# Use defaults Omarchy defaults (but don't edit these directly!)
source = ~/.local/share/omarchy/default/hypr/autostart.conf
source = ~/.local/share/omarchy/default/hypr/bindings/media.conf
source = ~/.local/share/omarchy/default/hypr/bindings/clipboard.conf
source = ~/.local/share/omarchy/default/hypr/bindings/tiling-v2.conf
source = ~/.local/share/omarchy/default/hypr/bindings/utilities.conf
source = ~/.local/share/omarchy/default/hypr/envs.conf
source = ~/.local/share/omarchy/default/hypr/looknfeel.conf
source = ~/.local/share/omarchy/default/hypr/input.conf
source = ~/.local/share/omarchy/default/hypr/windows.conf
source = ~/.local/state/omarchy/current/theme/hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/weather.conf

# Add any other personal Hyprland configuration below
# windowrule = workspace 5, match:class qemu

# App workspace assignments
windowrule = workspace 3 silent, match:class ^(zen)$
windowrule = tile on, match:class ^(zen)$
windowrule = workspace 5 silent, match:class ^(jetbrains-studio)$
windowrule = workspace 4 silent, match:class ^(dev.zed.Zed)$
# Startup terminals (autostart launches ghostty with these custom classes)
windowrule = workspace 1 silent, match:class ^(org\.banyar\.startup-term1)$
windowrule = workspace 2 silent, match:class ^(org\.banyar\.startup-term2)$
windowrule = workspace 6 silent, match:class ^(org\.banyar\.startup-term6)$

# Special-workspace apps
windowrule = workspace special:rom silent, match:class ^(chrome-discord\.com__channels_@me-Default)$
windowrule = workspace special:communication silent, match:class ^(chrome-ophjlpahpchlmihnnnihgmmeilfjmjjc__index\.html-Default)$

# Workspace to monitor assignments
workspace = 1, monitor:DP-1
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-2
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-3

# Override floating window default size (omarchy default is 875x600)
windowrule = size 1200 800, match:tag floating-window

# Per-app size overrides
windowrule = size 1200 800, match:class (org.omarchy.terminal)

# Toggle config flags dynamically
source = ~/.local/state/omarchy/toggles/hypr/*.conf
