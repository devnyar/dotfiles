# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER, H, scrcpy, exec, omarchy-launch-or-focus ^(scrcpy)$ "uwsm-app -- scrcpy"

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT, G, Glance, exec, omarchy-launch-or-focus-webapp WhatsApp "https://glance.banyar.app/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Special workspaces
bindd = SUPER, U, Toggle scratchpad, togglespecialworkspace, scratchpad
bindd = SUPER SHIFT, U, Move to scratchpad, movetoworkspacesilent, special:scratchpad
bindd = SUPER, R, Toggle ROM, togglespecialworkspace, rom
bindd = SUPER SHIFT, R, Move to ROM, movetoworkspacesilent, special:rom
unbind = SUPER, B
bindd = SUPER, B, Toggle communication, togglespecialworkspace, communication
bindd = SUPER SHIFT, G, Move to communication, movetoworkspacesilent, special:communication
bindd = SUPER, M, Toggle music, togglespecialworkspace, music
workspace = special:music, on-created-empty:uwsm-app -- xdg-terminal-exec cliamp

# SUPER+W: close window — but confirm first when it's the Zen browser (it
# otherwise closes instantly with no warning, unlike Ctrl+Q).
unbind = SUPER, W
bindd = SUPER, W, Close window, exec, ~/.config/hypr/scripts/close-window.sh
# SUPER+E: file manager, SUPER+Q: system menu
bindd = SUPER, E, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER, Q, Omarchy menu, exec, omarchy-menu

# Move app launcher from Super+Space to Super+S
unbind = SUPER, SPACE
unbind = SUPER, S
bindd = SUPER, S, Launch apps, exec, omarchy-launch-walker

# Numpad workspace switching — bind by keycode so it fires regardless of NumLock state.
# xkb keycode = evdev keycode + 8. KP1=87, KP2=88, KP3=89, KP4=83, KP5=84, KP6=85, KP7=79, KP8=80, KP9=81, KP0=90.
bindd = SUPER, code:87, Switch to workspace 1, workspace, 1
bindd = SUPER, code:88, Switch to workspace 2, workspace, 2
bindd = SUPER, code:89, Switch to workspace 3, workspace, 3
bindd = SUPER, code:83, Switch to workspace 4, workspace, 4
bindd = SUPER, code:84, Switch to workspace 5, workspace, 5
bindd = SUPER, code:85, Switch to workspace 6, workspace, 6
bindd = SUPER, code:79, Switch to workspace 7, workspace, 7
bindd = SUPER, code:80, Switch to workspace 8, workspace, 8
bindd = SUPER, code:81, Switch to workspace 9, workspace, 9
bindd = SUPER, code:90, Switch to workspace 10, workspace, 10

# Move active window to workspace via numpad
bindd = SUPER SHIFT, code:87, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, code:88, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, code:89, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, code:83, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, code:84, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, code:85, Move window to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, code:79, Move window to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, code:80, Move window to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, code:81, Move window to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, code:90, Move window to workspace 10, movetoworkspace, 10

# MX Master 3s gesture button targets (triggered by logid / logiops)
bindd = SUPER CTRL, right, Next workspace (mouse gesture), workspace, e+1
bindd = SUPER CTRL, left, Previous workspace (mouse gesture), workspace, e-1
bindd = SUPER CTRL, up, Fullscreen (mouse gesture), fullscreen
bindd = SUPER CTRL, Return, Omarchy menu (mouse click), exec, omarchy-menu

# External monitor brightness (DDC/CI)
# This desktop has no laptop backlight, so omarchy's default XF86MonBrightness
# handler is a no-op (OSD shows but nothing changes). Unbind the defaults and
# point the keys at brightness-ddc.sh, which drives the LG + AOC via ddcutil.
unbind = , XF86MonBrightnessUp
unbind = , XF86MonBrightnessDown
unbind = SHIFT, XF86MonBrightnessUp
unbind = SHIFT, XF86MonBrightnessDown
unbind = ALT, XF86MonBrightnessUp
unbind = ALT, XF86MonBrightnessDown
bindeld = , XF86MonBrightnessUp, Brightness up, exec, ~/.config/hypr/scripts/brightness-ddc.sh +5%
bindeld = , XF86MonBrightnessDown, Brightness down, exec, ~/.config/hypr/scripts/brightness-ddc.sh 5%-
bindeld = SHIFT, XF86MonBrightnessUp, Brightness max, exec, ~/.config/hypr/scripts/brightness-ddc.sh 100%
bindeld = SHIFT, XF86MonBrightnessDown, Brightness min, exec, ~/.config/hypr/scripts/brightness-ddc.sh 1%
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, ~/.config/hypr/scripts/brightness-ddc.sh +1%
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, ~/.config/hypr/scripts/brightness-ddc.sh 1%-
