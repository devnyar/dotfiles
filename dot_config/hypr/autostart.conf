# Extra autostart processes
# exec-once = uwsm-app -- my-service
# exec-once = hyprctl output create headless
# exec-once = uwsm-app -- wayvnc --output=HEADLESS-2

# App workspace assignments — windowrules in hyprland.conf actually route these by class
exec-once = uwsm-app -- "/home/banyar/.local/share/JetBrains/Toolbox/apps/android-studio/bin/studio"
exec-once = uwsm-app -- zeditor
exec-once = uwsm-app -- /opt/zen-browser-bin/zen-bin
# wl-gammarelay-rs is the single color/brightness daemon: a constant 5100K warm
# tint on all monitors AND per-output gamma dimming for the DDC-less DP-3 strip
# (see brightness-ddc.sh). It replaces hyprsunset, which fights it — only one
# client can own an output's gamma LUT, and wl-gammarelay wins.
exec-once = wl-gammarelay-rs
exec-once = bash -c 'until busctl --user get-property rs.wl-gammarelay / rs.wl.gammarelay Temperature >/dev/null 2>&1; do sleep 0.3; done; busctl --user set-property rs.wl-gammarelay / rs.wl.gammarelay Temperature q 5100'
exec-once = ~/.config/hypr/scripts/monitor-watcher.sh
# Pre-build the DDC brightness bus cache so the first brightness keypress is instant.
exec-once = ~/.config/hypr/scripts/brightness-ddc.sh warmup

# Startup terminals — disable gtk-single-instance so each gets its own process and --class sticks,
# letting the windowrules in hyprland.conf route them to ws 1, 2, and 6.
exec-once = uwsm-app -- ghostty --gtk-single-instance=false --class=org.banyar.startup-term1
exec-once = uwsm-app -- ghostty --gtk-single-instance=false --class=org.banyar.startup-term2
exec-once = uwsm-app -- ghostty --gtk-single-instance=false --class=org.banyar.startup-term6

# Special-workspace apps (windowrules in hyprland.conf send them silently to special:rom / special:communication)
# Discord uses its own --user-data-dir so it doesn't race with LINE on chromium's default profile lock.
# (chromium auto-derives the WM class from the --app URL → "chrome-discord.com__channels_@me-Default", matched in hyprland.conf)
exec-once = uwsm-app -- chromium --user-data-dir=/home/banyar/.config/chromium-discord --app=https://discord.com/channels/@me
exec-once = uwsm-app -- chromium --remote-debugging-port=9222 --remote-allow-origins=* --app=chrome-extension://ophjlpahpchlmihnnnihgmmeilfjmjjc/index.html

# LINE Thai->English translator: waits for LINE (with debug port) and attaches
exec-once = ~/.local/share/line/autostart-driver.sh
