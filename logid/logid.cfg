// logid config for Logitech MX Master 3s — Hyprland/Omarchy
// Gesture button (thumb rest, CID 0xc3) + directions -> SUPER+CTRL+arrows (see ~/.config/hypr/bindings.conf)
//
// This is a SYSTEM file: logid reads /etc/logid.cfg as root, so chezmoi
// (which runs unprivileged) can't manage it directly. It's tracked here for
// reference/history only — deploy it manually with sudo:
//   sudo ln -sf ~/.local/share/chezmoi/logid/logid.cfg /etc/logid.cfg && sudo systemctl restart logid
devices: (
{
    name: "Wireless Mouse MX Master 3";

    // Free-spinning wheel: flick fast to disengage the ratchet
    smartshift: {
        on: true;
        threshold: 20;   // lower = easier to free-spin
    };

    // High-resolution scrolling
    hiresscroll: {
        hires: true;
        invert: false;
        target: false;
    };

    dpi: 1200;   // pointer speed (200-4000)

    buttons: (
        // ---- Gesture button (flat button under the thumb rest), CID 0xc3 ----
        {
            cid: 0xc3;
            action = {
                type: "Gestures";
                gestures: (
                    {   // hold + push UP  -> fullscreen
                        direction: "Up";
                        mode: "OnRelease";
                        action = { type: "Keypress"; keys: ["KEY_LEFTMETA","KEY_LEFTCTRL","KEY_UP"]; };
                    },
                    {   // hold + push LEFT -> previous workspace
                        direction: "Left";
                        mode: "OnRelease";
                        action = { type: "Keypress"; keys: ["KEY_LEFTMETA","KEY_LEFTCTRL","KEY_LEFT"]; };
                    },
                    {   // hold + push RIGHT -> next workspace
                        direction: "Right";
                        mode: "OnRelease";
                        action = { type: "Keypress"; keys: ["KEY_LEFTMETA","KEY_LEFTCTRL","KEY_RIGHT"]; };
                    },
                    {   // click without moving -> omarchy menu
                        direction: "None";
                        mode: "OnRelease";
                        action = { type: "Keypress"; keys: ["KEY_LEFTMETA","KEY_LEFTCTRL","KEY_ENTER"]; };
                    }
                );
            };
        }
    );
}
);
